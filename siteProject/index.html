<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Electro Guide - Home</title>
    </head>
    <body>
        <!-- Site Header -->
        <header>
            <a href="index.html" style="height: 50px;">
                <img id="headericon" src="./media/icon.jpg"
                    alt="Electro Guide Icon" height="50px">
            </a>
            <!-- The navigation on top. Will be replaced with dropdown menu at thinner screen size -->
            <div class="navbar">
                <a href="#" class="navbutton">Home</a>
                <a href="#" class="navbutton">About</a>
                <a href="#" class="navbutton">Catalogue</a>
                <a href="#" class="navbutton">Credits</a>
            </div>

            <!-- The nav dropdown for thinner screens -->
            <details class="navdropdown">
                <summary style="list-style: none; height: 100%" role="button">
                    <p>≡</p>
                </summary>
                <ul dir="rtl" id="navdroplist">
                    <a href="#" class="navdropbutton">Home</a>
                    <a href="#" class="navdropbutton">About</a>
                    <a href="#" class="navdropbutton">Catalogue</a>
                    <a href="#" class="navdropbutton">Credits</a>
                </ul>
            </details>
        </header>

        <!-- The primary site content -->
        <main>
            <!-- The top of the page. Features bright, glowing text -->
            <div id="title">
                <h1>The Home of <span id="edm">EDM</span></h1>
                <h1 id="edm-glow"><span style="color: rgba(0, 0, 0, 0)">The home
                        of </span><span id="edm">EDM</span></h1>
            </div>

            <!-- The first bit of homepage content. Explanations and such -->
            <div class="intro">
                <p><strong>Electronic Dance Music</strong> (EDM) is a broad
                    range of percussive electronic music genres originally made
                    for nightclubs, raves, and festivals. - Wikipedia</p>
            </div>
        </main>

        <!-- Site Footer -->
        <footer>
            <p>Various nav links</p>
            <p>Copyright, maybe</p>
        </footer>
    </body>
</html>
